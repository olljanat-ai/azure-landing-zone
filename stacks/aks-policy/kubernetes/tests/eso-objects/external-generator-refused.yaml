# A generator instead of the vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s
  namespace: ext-fi-example
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: key-vault
  target:
    name: s
  data: []
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: p
