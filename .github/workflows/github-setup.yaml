# Temporary: configures the GitHub side of the Azure OIDC integration (docs/deployment.md, step 4).
# Removed again after it has run once.
name: GitHub setup

on:
  push:
    branches: [claude/fervent-volta-vktd9o]
    paths: [.github/workflows/github-setup.yaml]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      R: ${{ github.repository }}
      TENANT: c7496d01-3dde-45a1-9cda-11cc2f3edace
      MGMT: 2e73156d-6206-4354-b599-1f4e31333a7d
    steps:
      - name: Repository variables
        run: |
          gh variable set BACKEND_AZURE_RESOURCE_GROUP_NAME -R $R -b rg-alz-build-state-swedencentral-001
          gh variable set BACKEND_AZURE_STORAGE_ACCOUNT_NAME -R $R -b stoalzbuiswe001ffcw
          gh variable set BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME -R $R -b build-tfstate

      - name: Environments
        run: |
          reviewer=$(gh api user --jq .id)
          echo "Required reviewer of platform-apply: $(gh api user --jq .login)"
          gh api -X PUT repos/$R/environments/platform-plan >/dev/null
          gh api -X PUT repos/$R/environments/platform-apply --input - >/dev/null <<EOF
          {"reviewers":[{"type":"User","id":$reviewer}],
           "deployment_branch_policy":{"protected_branches":false,"custom_branch_policies":true}}
          EOF
          if ! gh api repos/$R/environments/platform-apply/deployment-branch-policies --jq '.branch_policies[].name' | grep -qx main; then
            gh api -X POST repos/$R/environments/platform-apply/deployment-branch-policies -f name=main -f type=branch >/dev/null
          fi
          for e in platform-plan platform-apply; do
            gh variable set AZURE_TENANT_ID       -R $R -e $e -b $TENANT
            gh variable set AZURE_SUBSCRIPTION_ID -R $R -e $e -b $MGMT
          done
          gh variable set AZURE_CLIENT_ID -R $R -e platform-plan  -b 43d763af-33fb-48e6-a008-9c7d6abdeac2
          gh variable set AZURE_CLIENT_ID -R $R -e platform-apply -b 28914dff-e4f7-4e2f-884d-eac26d0a6c20

      - name: Ruleset for main
        run: |
          if gh api repos/$R/rulesets --jq '.[].name' | grep -qx main; then
            echo "Ruleset main already exists"
            exit 0
          fi
          gh api -X POST repos/$R/rulesets --input - >/dev/null <<'EOF'
          {"name":"main","target":"branch","enforcement":"active",
           "conditions":{"ref_name":{"include":["~DEFAULT_BRANCH"],"exclude":[]}},
           "rules":[{"type":"deletion"},{"type":"non_fast_forward"},
            {"type":"pull_request","parameters":{"required_approving_review_count":0,"dismiss_stale_reviews_on_push":false,
             "require_code_owner_review":false,"require_last_push_approval":false,"required_review_thread_resolution":false}}]}
          EOF

      - name: Show result
        run: |
          gh api repos/$R/actions/oidc/customization/sub
          gh variable list -R $R
          for e in platform-plan platform-apply; do echo "== $e"; gh variable list -R $R -e $e; done
          gh api repos/$R/environments/platform-apply --jq '{reviewers: [.protection_rules[].reviewers[]?.reviewer.login], branch_policy: .deployment_branch_policy}'
