# Egress out of the cluster only by FQDN (R20, design section 16) - the admission side of the rules
# aks-fluxcd-platform's scripts/check-egress.py checks in CI (which also checks the names against
# the zone's Firewall allow-list; admission cannot, it sees no other object):
#
#   - CiliumNetworkPolicy egress only to toEndpoints, toServices (an in-cluster Service) and toFQDNs
#     with toPorts; no toCIDR, toCIDRSet, toEntities, toGroups, toNodes, toRequires;
#   - a toFQDNs pattern only as `*.` in front of a name at least three labels long and not right
#     below a shared cloud suffix; never a bare `*`;
#   - DNS rules only for names the policy allows in toFQDNs, plus the cluster's own names; no `*`;
#   - no Key Vault, neither in toFQDNs nor in DNS rules: secrets come from the zone's External
#     Secrets Operator (R7b);
#   - no Kubernetes NetworkPolicy egress ipBlock;
#   - pods use the cluster DNS: dnsPolicy ClusterFirst (or unset) and no dnsConfig nameservers.
#
# CiliumClusterwideNetworkPolicy, CiliumCIDRGroup and CiliumEgressGatewayPolicy are cluster-wide,
# which no application namespace's RBAC reaches.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8splatformfqdnegress
  annotations:
    description: Application egress only to in-cluster endpoints and named FQDNs with ports; pods use the cluster DNS.
spec:
  crd:
    spec:
      names:
        kind: K8sPlatformFqdnEgress
      validation:
        openAPIV3Schema:
          type: object
          properties:
            sharedSuffixes:
              type: array
              description: DNS suffixes under which every customer has names; a wildcard right below one is refused.
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8splatformfqdnegress

        forbidden_peers := {"toCIDR", "toCIDRSet", "toEntities", "toGroups", "toNodes", "toRequires"}

        key_vault_suffixes := {"vault.azure.net", "vaultcore.azure.net"}

        obj := input.review.object

        # CiliumNetworkPolicy: spec, or every entry of specs
        specs[spec] {
          obj.kind == "CiliumNetworkPolicy"
          spec := obj.spec
        }

        specs[spec] {
          obj.kind == "CiliumNetworkPolicy"
          spec := obj.specs[_]
        }

        violation[{"msg": msg}] {
          rule := specs[_].egress[_]
          peer := forbidden_peers[_]
          rule[peer]
          msg := sprintf("CiliumNetworkPolicy %v: egress %v is not allowed - only toEndpoints, toServices and toFQDNs (design section 16).", [obj.metadata.name, peer])
        }

        violation[{"msg": msg}] {
          service := specs[_].egress[_].toServices[_]
          not service.k8sService
          not service.k8sServiceSelector
          msg := sprintf("CiliumNetworkPolicy %v: toServices must name an in-cluster Service.", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          rule := specs[_].egress[_]
          rule.toFQDNs
          count(object.get(rule, "toPorts", [])) == 0
          msg := sprintf("CiliumNetworkPolicy %v: toFQDNs without toPorts - every destination names its ports.", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          spec := specs[_]
          name := fqdns(spec)[_]
          too_broad(name)
          msg := sprintf("CiliumNetworkPolicy %v: toFQDNs %v - a wildcard only as the leftmost label of a name at least two labels below a public suffix.", [obj.metadata.name, name])
        }

        violation[{"msg": msg}] {
          spec := specs[_]
          name := fqdns(spec)[_]
          key_vault(name)
          msg := sprintf("CiliumNetworkPolicy %v: toFQDNs %v - no Key Vault; secrets come from the zone's External Secrets Operator.", [obj.metadata.name, name])
        }

        violation[{"msg": msg}] {
          spec := specs[_]
          name := dns_names(spec)[_]
          name == "*"
          msg := sprintf("CiliumNetworkPolicy %v: DNS rule '*' resolves anything - list the names the policy allows.", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          spec := specs[_]
          name := dns_names(spec)[_]
          key_vault(name)
          msg := sprintf("CiliumNetworkPolicy %v: DNS rule %v - no Key Vault.", [obj.metadata.name, name])
        }

        violation[{"msg": msg}] {
          spec := specs[_]
          name := dns_names(spec)[_]
          name != "*"
          not key_vault(name)
          not endswith(name, "cluster.local")
          not fqdns(spec)[name]
          msg := sprintf("CiliumNetworkPolicy %v: DNS rule %v for a name the policy does not allow in toFQDNs.", [obj.metadata.name, name])
        }

        fqdns(spec) := {normal(value) |
          selector := spec.egress[_].toFQDNs[_]
          value := fqdn_value(selector)
        }

        dns_names(spec) := {normal(value) |
          selector := spec.egress[_].toPorts[_].rules.dns[_]
          value := fqdn_value(selector)
        }

        fqdn_value(selector) := value {
          value := selector.matchName
        } else := value {
          value := selector.matchPattern
        } else := ""

        normal(name) := lower(trim_suffix(name, "."))

        too_broad(name) {
          name == "*"
        }

        too_broad(name) {
          name == ""
        }

        # A `*` anywhere but in the leftmost label.
        too_broad(name) {
          labels := split(name, ".")
          rest := array.slice(labels, 1, count(labels))
          contains(concat(".", rest), "*")
        }

        too_broad(name) {
          startswith(name, "*.")
          count(split(name, ".")) < 4
        }

        too_broad(name) {
          startswith(name, "*.")
          substring(name, 2, -1) == input.parameters.sharedSuffixes[_]
        }

        key_vault(name) {
          endswith(name, key_vault_suffixes[_])
        }

        # Kubernetes NetworkPolicy

        violation[{"msg": msg}] {
          obj.kind == "NetworkPolicy"
          obj.spec.egress[_].to[_].ipBlock
          msg := sprintf("NetworkPolicy %v: egress ipBlock is not allowed - name the destination by FQDN in a CiliumNetworkPolicy.", [obj.metadata.name])
        }

        # Pods use the cluster DNS

        violation[{"msg": msg}] {
          obj.kind == "Pod"
          policy := object.get(obj.spec, "dnsPolicy", "ClusterFirst")
          policy != "ClusterFirst"
          msg := sprintf("Pod %v: dnsPolicy %v - pods resolve through the cluster DNS (ClusterFirst), where the FQDN policies see the lookups.", [obj.metadata.name, policy])
        }

        violation[{"msg": msg}] {
          obj.kind == "Pod"
          count(object.get(obj.spec, ["dnsConfig", "nameservers"], [])) > 0
          msg := sprintf("Pod %v: dnsConfig nameservers are not allowed - pods resolve through the cluster DNS.", [obj.metadata.name])
        }
