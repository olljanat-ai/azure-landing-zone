# The parameters stacks/aks-policy assigns (kubernetes.tf).
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformGatewayOnly
metadata:
  name: gateway-only
spec:
  match:
    kinds:
    - apiGroups:
      - ''
      kinds:
      - Service
    - apiGroups:
      - gateway.networking.k8s.io
      kinds:
      - Gateway
      - HTTPRoute
    excludedNamespaces:
    - kube-system
    - gatekeeper-system
    - azure-arc
    - azure-extensions-usage-system
    - flux-system
    - kube-public
    - aks-istio-system
    - kube-node-lease
    - external-secrets
    - external-dns
    - platform-gateway
    - '*-gateway'
    - '*-secrets'
  parameters:
    zones:
    - int-fi
    - int-se
    - ext-fi
    - ext-se
    domainSuffix: dev.onek8s.lol
