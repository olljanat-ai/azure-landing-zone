---
# Create, rebuild or delete one stateless cell (aks-design sections 12 and 17). This is the exit criterion of
# phase 1 – "a stateless cell can be created and deleted by the pipeline" – and the building block of the
# rebuild test in phase 3. Before a cell of an environment with traffic is deleted, it is drained in the cell
# router (Front Door origin disabled, NGINXaaS server marked down); the other cells carry the load (N+1).
name: AKS cell

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev]
        default: dev
      cell:
        description: Cell
        type: choice
        options: [sl-az1, sl-az2, sl-az3]
        default: sl-az1
      action:
        description: create = apply, delete = destroy
        type: choice
        options: [create, delete]
        default: create

concurrency:
  group: aks-${{ inputs.environment }}-${{ inputs.cell }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.environment }}/${{ inputs.cell }}
    uses: ./.github/workflows/terraform-stack.yaml
    permissions:
      id-token: write
      contents: read
    with:
      root_module: stacks/aks-stateless-cell
      state_key: aks-${{ inputs.environment }}-${{ inputs.cell }}.tfstate
      var_file: environments/${{ inputs.environment }}/${{ inputs.cell }}.tfvars
      environment_prefix: aks-${{ inputs.environment }}
      runs_on: '["self-hosted"]'
      terraform_action: ${{ inputs.action == 'delete' && 'destroy' || 'apply' }}

  smoke-test:
    name: Smoke test ${{ inputs.environment }}/${{ inputs.cell }}
    needs: terraform
    if: inputs.action == 'create'
    runs-on: [self-hosted]
    environment: aks-${{ inputs.environment }}-plan
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC, read-only identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Cluster settings match the design
        env:
          CLUSTER: aks-${{ inputs.environment }}-${{ inputs.cell }}
          RG: rg-aks-${{ inputs.environment }}-${{ inputs.cell }}-swedencentral
        run: |
          set -euo pipefail
          az aks show -g "$RG" -n "$CLUSTER" -o json > cluster.json
          check() { # <jq expression> <expected> <requirement>
            actual="$(jq -r "$1" cluster.json)"
            if [ "$actual" = "$2" ]; then echo "PASS $3: $1 = $actual"; else echo "FAIL $3: $1 = $actual (expected $2)"; failed=1; fi
          }
          failed=0
          check '.provisioningState'                                                  Succeeded  "provisioned"
          check '.apiServerAccessProfile.enablePrivateCluster'                        true       "R1 private API server"
          check '.apiServerAccessProfile.enableVnetIntegration'                       true       "R1 API Server VNet Integration"
          check '.disableLocalAccounts'                                               true       "Entra ID only"
          check '.networkProfile.networkPluginMode'                                   overlay    "R9b overlay CNI"
          check '.networkProfile.networkDataplane'                                    cilium     "R9b Cilium"
          check '.networkProfile.outboundType'                                        userDefinedRouting "egress via Firewall"
          check '.networkProfile.advancedNetworking.performance.accelerationMode'     BpfVeth    "R19 eBPF host routing"
          check '.networkProfile.advancedNetworking.security.advancedNetworkPolicies' FQDN       "R20 FQDN egress policies"
          check '.nodeProvisioningProfile.mode'                                       Auto       "R11 node auto provisioning"
          check '.securityProfile.azureKeyVaultKms.enabled'                           true       "R21 KMS"
          check '.securityProfile.azureKeyVaultKms.keyVaultNetworkAccess'             Private    "R21 private vault"
          check '(.diskEncryptionSetId // .diskEncryptionSetID) | test("des-")'       true       "R21 disk encryption set"
          check '.addonProfiles.azurepolicy.enabled'                                  true       "R14 Azure Policy add-on"
          check '(.addonProfiles.azureKeyvaultSecretsProvider.enabled // false)'      false      "R7b no Secrets Store CSI driver"
          check '.agentPoolProfiles[0].osSku'                                         AzureLinux3 "R19 Azure Linux 3"
          check '.agentPoolProfiles[0].enableEncryptionAtHost'                        true       "R21 encryption at host"
          exit $failed

      - name: API server reachable only through the management VNet private endpoint (R1)
        env:
          CLUSTER: aks-${{ inputs.environment }}-${{ inputs.cell }}
          RG: rg-aks-${{ inputs.environment }}-${{ inputs.cell }}-swedencentral
        run: |
          set -euo pipefail
          az aks install-cli --install-location "$HOME/bin/kubectl" --kubelogin-install-location "$HOME/bin/kubelogin" >/dev/null
          export PATH="$HOME/bin:$PATH"
          az aks get-credentials -g "$RG" -n "$CLUSTER" --file kubeconfig --overwrite-existing
          export KUBECONFIG="$PWD/kubeconfig"
          kubelogin convert-kubeconfig -l azurecli
          fqdn="$(az aks show -g "$RG" -n "$CLUSTER" --query privateFqdn -o tsv)"
          echo "API server $fqdn resolves to $(dig +short "$fqdn" | tail -1) (private endpoint in snet-aks-api-pe)"
          kubectl get nodes -o wide
          kubectl get pods -A
          if [ -n "$(kubectl get nodes -l kubernetes.azure.com/ebpf-host-routing=true -o name)" ]; then
            echo "PASS R19 eBPF host routing label on nodes"
          else
            echo "FAIL R19 no node carries kubernetes.azure.com/ebpf-host-routing=true"; exit 1
          fi
