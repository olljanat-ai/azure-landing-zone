# A store served by another zone's operator.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: key-vault
  namespace: ext-fi-example
spec:
  controller: int-fi
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-onek8s-dev-ext-fi.vault.azure.net/
      serviceAccountRef:
        name: key-vault
