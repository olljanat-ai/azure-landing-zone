apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  annotations:
    kubernetes.io/description: int-se zone, spot, amd64 and arm64
  name: intsespot
spec:
  disruption:
    budgets:
    - nodes: 10%
    consolidateAfter: 5m
    consolidationPolicy: WhenEmptyOrUnderutilized
  limits:
    cpu: '8'
    memory: 32Gi
  template:
    metadata:
      labels:
        kubernetes.azure.com/ebpf-dataplane: cilium
        platform/zone: int-se
    spec:
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: intse
      requirements:
      - key: kubernetes.io/os
        operator: In
        values:
        - linux
      - key: kubernetes.io/arch
        operator: In
        values:
        - amd64
        - arm64
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - spot
      - key: topology.kubernetes.io/zone
        operator: In
        values:
        - swedencentral-1
      - key: karpenter.azure.com/sku-series
        operator: In
        values:
        - Ds_v5
        - Ds_v6
        - Es_v5
        - Es_v6
        - Dps_v6
        - Eps_v6
      startupTaints:
      - effect: NoExecute
        key: node.cilium.io/agent-not-ready
        value: 'true'
      taints:
      - effect: NoSchedule
        key: platform/zone
        value: int-se
      - effect: NoSchedule
        key: platform/capacity
        value: spot
  weight: 50
