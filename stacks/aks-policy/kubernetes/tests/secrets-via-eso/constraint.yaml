# The parameters stacks/aks-policy assigns (kubernetes.tf).
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformSecretsViaEso
metadata:
  name: secrets-via-eso
spec:
  match:
    kinds:
    - apiGroups:
      - ''
      kinds:
      - Secret
    excludedNamespaces:
    - kube-system
    - gatekeeper-system
    - azure-arc
    - azure-extensions-usage-system
    - flux-system
    - kube-public
    - aks-istio-system
    - kube-node-lease
    - external-secrets
    - external-dns
    - platform-gateway
    - '*-secrets'
  parameters:
    zones:
    - int-fi
    - int-se
    - ext-fi
    - ext-se
