# The parameters stacks/aks-policy assigns (kubernetes.tf).
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformNodePools
metadata:
  name: node-pools
spec:
  match:
    kinds:
    - apiGroups:
      - karpenter.sh
      kinds:
      - NodePool
    - apiGroups:
      - karpenter.azure.com
      kinds:
      - AKSNodeClass
  parameters:
    zones:
    - int-fi
    - int-se
    - ext-fi
    - ext-se
    allowedSkuSeries:
    - Ds_v5
    - Ds_v6
    - Es_v5
    - Es_v6
    - Dps_v6
    - Eps_v6
    exemptNames:
    - default
    - system-surge
