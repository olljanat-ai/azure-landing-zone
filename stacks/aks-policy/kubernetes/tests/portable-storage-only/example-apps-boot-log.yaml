apiVersion: v1
kind: Pod
metadata:
  name: boot-log
  namespace: ext-fi-example
  labels:
    app.kubernetes.io/name: boot-log
spec:
  automountServiceAccountToken: false
  containers:
  - command:
    - sh
    - -c
    - 'set -e

      mkdir -p /data/boot-log

      echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $NODE_NAME $POD_NAME" >> /data/boot-log/log.txt

      exec httpd -f -v -p 8080 -h /data

      '
    env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    image: docker.io/library/busybox:1.37.0
    name: boot-log
    ports:
    - containerPort: 8080
      name: http
    readinessProbe:
      httpGet:
        path: /boot-log/log.txt
        port: http
      periodSeconds: 10
    resources:
      limits:
        cpu: 50m
        memory: 32Mi
      requests:
        cpu: 5m
        memory: 16Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
    - mountPath: /data
      name: data
  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: boot-log
