# The parameters stacks/aks-policy assigns to the stateful cluster (kubernetes.tf).
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformRolloutGuardrails
metadata:
  name: rollout-guardrails
spec:
  match:
    kinds:
    - apiGroups:
      - apps
      - autoscaling
      - policy
      kinds:
      - Deployment
      - StatefulSet
      - HorizontalPodAutoscaler
      - PodDisruptionBudget
    excludedNamespaces:
    - kube-system
    - gatekeeper-system
    - azure-arc
    - azure-extensions-usage-system
    - flux-system
    - kube-public
    - aks-istio-system
    - kube-node-lease
    - external-secrets
    - external-dns
    - platform-gateway
    - '*-gateway'
    - '*-secrets'
  parameters:
    minReplicas: 3
    spreadTopologyKey: topology.kubernetes.io/zone
    requireNoUnavailable: false
