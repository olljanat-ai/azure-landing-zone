# dataFrom extract of another namespace's secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s
  namespace: ext-fi-example
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: key-vault
  target:
    name: s
  data: []
  dataFrom:
  - extract:
      key: secret/ext-fi-other--json
