# Limits moved too.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: aks-hello
  namespace: ext-fi-example
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aks-hello
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
    - containerName: '*'
      controlledValues: RequestsAndLimits
      maxAllowed:
        cpu: '1'
        memory: 1Gi
