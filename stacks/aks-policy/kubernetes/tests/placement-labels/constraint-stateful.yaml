# The stateful cluster: amd64 on-demand only.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformPlacementLabels
metadata:
  name: placement-labels-stateful
spec:
  match:
    kinds:
    - apiGroups:
      - ''
      kinds:
      - Pod
    excludedNamespaces:
    - kube-system
    - gatekeeper-system
    - azure-arc
    - azure-extensions-usage-system
    - flux-system
    - kube-public
    - aks-istio-system
    - kube-node-lease
    - external-secrets
    - external-dns
    - platform-gateway
    - infra-observability
    - '*-gateway'
    - '*-secrets'
  parameters:
    allowedArchitectures:
    - amd64
    allowedCapacities:
    - on-demand
    allowedAccelerators: []
