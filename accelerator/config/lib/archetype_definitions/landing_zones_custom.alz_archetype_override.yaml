base_archetype: landing_zones
name: landing_zones_custom
policy_assignments_to_add: []
policy_assignments_to_remove: [
# No monitoring in the lab for now (observability comes later): no Log Analytics workspace, no Azure Monitor Agent
# identity and no data collection rules (management_resources_enabled = false in platform-landing-zone.tfvars), so
# the ALZ assignments that send data to them or point at them are not assigned. Assign them again together with
# the management resources.
  Deploy-AzSqlDb-Auditing,
  Deploy-MDFC-DefSQL-AMA,
  Deploy-VM-ChangeTrack,
  Deploy-VM-Monitoring,
  Deploy-vmArc-ChangeTrack,
  Deploy-vmHybr-Monitoring,
  Deploy-VMSS-ChangeTrack,
  Deploy-VMSS-Monitoring,
# The build tenant has no DDoS protection plan (ddos_protection_plan_enabled = false):
  Enable-DDoS-VNET,
]
policy_definitions_to_add: []
policy_definitions_to_remove: []
policy_set_definitions_to_add: []
policy_set_definitions_to_remove: []
