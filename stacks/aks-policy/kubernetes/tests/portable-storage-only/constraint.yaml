# The parameters stacks/aks-policy assigns (kubernetes.tf).
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformPortableStorage
metadata:
  name: portable-storage-only
spec:
  match:
    kinds:
    - apiGroups:
      - ''
      kinds:
      - Pod
      - PersistentVolumeClaim
    excludedNamespaces:
    - kube-system
    - gatekeeper-system
    - azure-arc
    - azure-extensions-usage-system
    - flux-system
    - kube-public
    - aks-istio-system
    - kube-node-lease
    - external-secrets
    - external-dns
    - platform-gateway
    - '*-gateway'
    - '*-secrets'
  parameters:
    storageClassName: portable-disk
