# AKS's control plane rewrites every Secret when the KMS encryption changes (seen on az3, KMS data encryption).
kind: AdmissionReview
apiVersion: admission.k8s.io/v1
request:
  uid: test
  kind:
    group: ''
    version: v1
    kind: Secret
  resource:
    group: ''
    version: v1
    resource: secrets
  name: ext-fi-example-auth
  namespace: ext-fi-example
  operation: UPDATE
  userInfo:
    username: aksService
  object: &id001
    apiVersion: v1
    kind: Secret
    metadata:
      name: ext-fi-example-auth
      namespace: ext-fi-example
    type: Opaque
    data:
      k: dg==
  oldObject: *id001
