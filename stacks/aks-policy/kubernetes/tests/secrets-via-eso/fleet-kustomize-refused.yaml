# The platform's own Flux applies a Secret from Git: not through a vault either.
kind: AdmissionReview
apiVersion: admission.k8s.io/v1
request:
  uid: test
  kind:
    group: ''
    version: v1
    kind: Secret
  resource:
    group: ''
    version: v1
    resource: secrets
  name: from-fleet
  namespace: ext-fi-example
  operation: UPDATE
  userInfo:
    username: system:serviceaccount:flux-system:kustomize-controller
  object: &id001
    apiVersion: v1
    kind: Secret
    metadata:
      name: from-fleet
      namespace: ext-fi-example
    type: Opaque
    data:
      k: dg==
  oldObject: *id001
