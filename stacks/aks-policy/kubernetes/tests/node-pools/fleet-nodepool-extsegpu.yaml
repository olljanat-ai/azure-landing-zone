apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  annotations:
    kubernetes.io/description: ext-se zone, NVIDIA GPU, on-demand, amd64
  name: extsegpu
spec:
  disruption:
    budgets:
    - nodes: 10%
    consolidateAfter: 1m
    consolidationPolicy: WhenEmptyOrUnderutilized
  limits:
    cpu: '40'
    memory: 330Gi
  template:
    metadata:
      labels:
        kubernetes.azure.com/ebpf-dataplane: cilium
        platform/accelerator: nvidia-gpu
        platform/zone: ext-se
    spec:
      expireAfter: 720h
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: extsegpu
      requirements:
      - key: kubernetes.io/os
        operator: In
        values:
        - linux
      - key: kubernetes.io/arch
        operator: In
        values:
        - amd64
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - on-demand
      - key: topology.kubernetes.io/zone
        operator: In
        values:
        - swedencentral-1
      - key: karpenter.azure.com/sku-series
        operator: In
        values:
        - NCads_v5
      - key: karpenter.azure.com/sku-gpu-manufacturer
        operator: In
        values:
        - nvidia
      - key: karpenter.azure.com/sku-gpu-name
        operator: In
        values:
        - H100
      startupTaints:
      - effect: NoExecute
        key: node.cilium.io/agent-not-ready
        value: 'true'
      taints:
      - effect: NoSchedule
        key: platform/zone
        value: ext-se
      - effect: NoSchedule
        key: platform/accelerator
        value: nvidia-gpu
  weight: 5
