# Controls CPU only, bounded.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: aks-hello
  namespace: ext-fi-example
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aks-hello
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
    - containerName: '*'
      controlledResources:
      - cpu
      controlledValues: RequestsOnly
      maxAllowed:
        cpu: '1'
