apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  annotations:
    kubernetes.io/description: GPU nodes of the ext-se zone
  name: extsegpu
spec:
  imageFamily: AzureLinux
  security:
    encryptionAtHost: true
  tags:
    EnableManagedGPUExperience: 'true'
    platform-accelerator: nvidia-gpu
    platform-zone: ext-se
  vnetSubnetID: /subscriptions/0000/resourceGroups/rg-aks-dev/providers/Microsoft.Network/virtualNetworks/vnet-aks-dev-stateless-az1/subnets/snet-ext-se-nodes
