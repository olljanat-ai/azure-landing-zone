# Stateful cluster: no resizing.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: aks-hello
  namespace: ext-fi-example
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aks-hello
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
    - containerName: aks-hello
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsOnly
      minAllowed:
        cpu: 3m
        memory: 64Mi
      maxAllowed:
        cpu: 20m
        memory: 128Mi
