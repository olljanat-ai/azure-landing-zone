# Node auto provisioning in the stateless cells (R4, R17, design section 2.3): a zone's nodes come only
# from its own AKSNodeClass and NodePools, named after the zone without its dash (`extfi`,
# `extfispot`):
#
#   - AKSNodeClass `<z>`: Azure Linux, encryption at host, the zone's node subnet
#     (`.../subnets/snet-<zone>-nodes`);
#   - NodePool `<z>` (on-demand) and `<z>spot` (spot): the class `<z>`, the label and taint
#     platform/zone=<zone>, one availability zone, the capacity type of its name, the spot taint
#     platform/capacity=spot on the spot pool, amd64 / arm64 only, and VM series only from the
#     allowed, VNet-encryption-capable list;
#   - AKSNodeClass `<z>gpu` and NodePool `<z>gpu` (GPU, on-demand, design decision D42): like the
#     zone's own, plus the taint platform/accelerator=nvidia-gpu, amd64 only, and VM series only from
#     the allowed GPU list - the GPU series that support VNet encryption and encryption at host;
#   - no other NodePool or AKSNodeClass, apart from the ones AKS manages itself (exemptNames).
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8splatformnodepools
  annotations:
    description: NAP NodePools and AKSNodeClasses only per isolation zone, in its subnet, with its label, taints and allowed VM series.
spec:
  crd:
    spec:
      names:
        kind: K8sPlatformNodePools
      validation:
        openAPIV3Schema:
          type: object
          properties:
            zones:
              type: array
              description: The isolation zones, e.g. int-fi, ext-fi.
              items:
                type: string
            allowedSkuSeries:
              type: array
              description: VM series (karpenter.azure.com/sku-series) a zone's NodePools may use.
              items:
                type: string
            allowedGpuSkuSeries:
              type: array
              description: VM series (karpenter.azure.com/sku-series) a zone's GPU NodePool may use.
              items:
                type: string
            exemptNames:
              type: array
              description: NodePools and AKSNodeClasses AKS manages itself.
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8splatformnodepools

        obj := input.review.object

        short(zone) := replace(zone, "-", "")

        exempt {
          obj.metadata.name == input.parameters.exemptNames[_]
        }

        # AKSNodeClass

        class_zone := zone {
          obj.kind == "AKSNodeClass"
          zone := input.parameters.zones[_]
          {short(zone), concat("", [short(zone), "gpu"])}[obj.metadata.name]
        }

        violation[{"msg": msg}] {
          obj.kind == "AKSNodeClass"
          not exempt
          not class_zone
          msg := sprintf("AKSNodeClass %v belongs to no isolation zone; a zone's classes are named after it without the dash (e.g. extfi, extfigpu).", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          zone := class_zone
          object.get(obj.spec, "imageFamily", "") != "AzureLinux"
          msg := sprintf("AKSNodeClass %v: imageFamily must be AzureLinux.", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          zone := class_zone
          object.get(obj.spec, ["security", "encryptionAtHost"], false) != true
          msg := sprintf("AKSNodeClass %v: security.encryptionAtHost must be true.", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          zone := class_zone
          subnet := object.get(obj.spec, "vnetSubnetID", "")
          not endswith(lower(subnet), lower(concat("", ["/subnets/snet-", zone, "-nodes"])))
          msg := sprintf("AKSNodeClass %v: vnetSubnetID must be the zone's node subnet snet-%v-nodes, not %v.", [obj.metadata.name, zone, subnet])
        }

        # NodePool

        pool_zone := zone {
          obj.kind == "NodePool"
          zone := input.parameters.zones[_]
          {short(zone), concat("", [short(zone), "spot"]), concat("", [short(zone), "gpu"])}[obj.metadata.name]
        }

        spot {
          endswith(obj.metadata.name, "spot")
        }

        gpu {
          endswith(obj.metadata.name, "gpu")
        }

        pool_class(zone) := concat("", [short(zone), "gpu"]) {
          gpu
        } else := short(zone)

        allowed_series := {s | s := input.parameters.allowedGpuSkuSeries[_]} {
          gpu
        } else := {s | s := input.parameters.allowedSkuSeries[_]}

        allowed_architectures := {"amd64"} {
          gpu
        } else := {"amd64", "arm64"}

        capacity := "spot" {
          spot
        } else := "on-demand"

        template := object.get(obj.spec, "template", {})

        violation[{"msg": msg}] {
          obj.kind == "NodePool"
          not exempt
          not pool_zone
          msg := sprintf("NodePool %v belongs to no isolation zone; a zone's NodePools are <zone>, <zone>spot and <zone>gpu without the dash (e.g. extfi, extfispot, extfigpu).", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          zone := pool_zone
          object.get(template, ["spec", "nodeClassRef", "name"], "") != pool_class(zone)
          msg := sprintf("NodePool %v must use the zone's AKSNodeClass %v.", [obj.metadata.name, pool_class(zone)])
        }

        violation[{"msg": msg}] {
          zone := pool_zone
          object.get(template, ["metadata", "labels", "platform/zone"], "") != zone
          msg := sprintf("NodePool %v must label its nodes platform/zone: %v.", [obj.metadata.name, zone])
        }

        violation[{"msg": msg}] {
          zone := pool_zone
          not has_taint("platform/zone", zone)
          msg := sprintf("NodePool %v must taint its nodes platform/zone=%v:NoSchedule.", [obj.metadata.name, zone])
        }

        violation[{"msg": msg}] {
          pool_zone
          spot
          not has_taint("platform/capacity", "spot")
          msg := sprintf("Spot NodePool %v must taint its nodes platform/capacity=spot:NoSchedule.", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          pool_zone
          gpu
          not has_taint("platform/accelerator", "nvidia-gpu")
          msg := sprintf("GPU NodePool %v must taint its nodes platform/accelerator=nvidia-gpu:NoSchedule.", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          pool_zone
          not requirement_is("karpenter.sh/capacity-type", {capacity})
          msg := sprintf("NodePool %v must require karpenter.sh/capacity-type In [%v].", [obj.metadata.name, capacity])
        }

        violation[{"msg": msg}] {
          pool_zone
          not single_value("topology.kubernetes.io/zone")
          msg := sprintf("NodePool %v must require exactly one availability zone (topology.kubernetes.io/zone): a cell lives in one.", [obj.metadata.name])
        }

        violation[{"msg": msg}] {
          pool_zone
          not requirement_within("kubernetes.io/arch", allowed_architectures)
          msg := sprintf("NodePool %v must require kubernetes.io/arch In a subset of %v.", [obj.metadata.name, sort(allowed_architectures)])
        }

        violation[{"msg": msg}] {
          pool_zone
          not requirement_within("karpenter.azure.com/sku-series", allowed_series)
          msg := sprintf("NodePool %v must require karpenter.azure.com/sku-series In a subset of %v (VNet-encryption-capable).", [obj.metadata.name, sort(allowed_series)])
        }

        has_taint(key, value) {
          taint := template.spec.taints[_]
          taint.key == key
          taint.value == value
          taint.effect == "NoSchedule"
        }

        requirements_of(key) := [r | r := template.spec.requirements[_]; r.key == key]

        values_of(r) := {v | v := r.values[_]}

        # Exactly one requirement on the key, operator In, with exactly these values.
        requirement_is(key, wanted) {
          rs := requirements_of(key)
          count(rs) == 1
          rs[0].operator == "In"
          values_of(rs[0]) == wanted
        }

        requirement_within(key, allowed) {
          rs := requirements_of(key)
          count(rs) == 1
          rs[0].operator == "In"
          count(values_of(rs[0])) > 0
          count(values_of(rs[0]) - allowed) == 0
        }

        single_value(key) {
          rs := requirements_of(key)
          count(rs) == 1
          rs[0].operator == "In"
          count(rs[0].values) == 1
        }
