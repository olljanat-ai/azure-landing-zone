# The parameters stacks/aks-policy assigns (kubernetes.tf).
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformFqdnEgress
metadata:
  name: fqdn-egress
spec:
  match:
    kinds:
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumNetworkPolicy
    - apiGroups:
      - networking.k8s.io
      kinds:
      - NetworkPolicy
    - apiGroups:
      - ''
      kinds:
      - Pod
    excludedNamespaces:
    - kube-system
    - gatekeeper-system
    - azure-arc
    - azure-extensions-usage-system
    - flux-system
    - kube-public
    - aks-istio-system
    - kube-node-lease
    - external-secrets
    - external-dns
    - platform-gateway
    - '*-gateway'
    - '*-secrets'
  parameters:
    sharedSuffixes:
    - core.windows.net
    - blob.core.windows.net
    - database.windows.net
    - servicebus.windows.net
    - azurewebsites.net
    - cloudapp.azure.com
    - cloudapp.net
    - azurecr.io
    - azure.com
    - windows.net
    - amazonaws.com
    - googleapis.com
    - github.io
    - githubusercontent.com
