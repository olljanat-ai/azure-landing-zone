apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/name: aks-hello
  name: aks-hello
  namespace: ext-fi-example
spec:
  hostnames:
  - hello-aks-dev-stateless-az1.ext-fi.dev.onek8s.lol
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ext-fi
    namespace: ext-fi-gateway
  rules:
  - backendRefs:
    - name: aks-hello
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
