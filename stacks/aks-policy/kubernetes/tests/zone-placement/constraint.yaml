# The parameters stacks/aks-policy assigns (kubernetes.tf).
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformZonePlacement
metadata:
  name: zone-placement
spec:
  match:
    kinds:
    - apiGroups:
      - ''
      kinds:
      - Pod
      - Namespace
    excludedNamespaces:
    - kube-system
    - gatekeeper-system
    - azure-arc
    - azure-extensions-usage-system
    - flux-system
    - kube-public
    - aks-istio-system
    - kube-node-lease
    - external-secrets
    - external-dns
    - platform-gateway
    - infra-observability
    - '*-gateway'
    - '*-secrets'
  parameters:
    zones:
    - int-fi
    - int-se
    - ext-fi
    - ext-se
