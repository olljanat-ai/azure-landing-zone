apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns.kubernetes.io/controller: traffic-manager
  labels:
    app.kubernetes.io/name: aks-hello
  name: aks-hello-global
  namespace: ext-fi-example
spec:
  hostnames:
  - hello.ext-fi.dev.onek8s.lol
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ext-fi
    namespace: ext-fi-gateway
  rules:
  - backendRefs:
    - name: aks-hello
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
