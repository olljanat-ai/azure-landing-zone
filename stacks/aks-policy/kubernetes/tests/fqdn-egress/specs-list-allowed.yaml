apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress
  namespace: ext-fi-app
specs:
- endpointSelector: {}
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
      rules:
        dns:
        - matchName: login.microsoftonline.com
  - toFQDNs:
    - matchName: login.microsoftonline.com
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
